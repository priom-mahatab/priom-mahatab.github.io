<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Portfolio</title>
  <meta name="description" content="Robotics & machine learning portfolio">
  <meta name="theme-color" content="#07090b">
  <!-- tab icon: the rover. SVG for modern browsers, PNGs for Safari and home-screen icons -->
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js" } }</script>
</head>
<body>
  <canvas id="scene" aria-hidden="true"></canvas>

  <div class="boot" id="boot"><pre id="boot-log" class="mono"></pre></div>

  <!-- top row: the mark, then a few labelled facts -->
  <header class="topbar">
    <a class="mark" href="#" id="home-link" aria-label="Back to start"><span class="mark-glyph" aria-hidden="true"></span></a>
    <div class="col col-fact"><span class="k">Currently:</span><span class="v" data-bind="role"></span></div>
    <div class="col col-fact col-study"><span class="k">Studying:</span><span class="v" data-bind="status"></span></div>
    <div class="col col-fact"><span class="k">Based in:</span><span class="v"><span data-bind="location"></span> (<time id="clock"></time>)</span></div>
    <nav class="col col-nav" aria-label="Sections">
      <span class="k">Navigation:</span>
      <button type="button" class="nav-toggle" id="nav-toggle" aria-expanded="false" aria-controls="top-nav"><span id="nav-current">Menu</span><i aria-hidden="true"></i></button>
      <div class="nav-list" id="top-nav"></div>
    </nav>
    <button type="button" class="menu-btn" id="index-btn" aria-expanded="false" aria-controls="index">Index</button>
  </header>

  <!-- the name, big along the bottom; it slides away as you fly in -->
  <section class="hero" id="hero">
    <div class="hero-row">
      <p class="lead"><span data-bind="tagline"></span> Scroll to fly through the work.</p>
      <button type="button" class="start" id="start-btn"><span>Begin trajectory</span><i aria-hidden="true">↓</i></button>
    </div>
    <h1 class="bigname" id="bigname"></h1>
  </section>

  <div class="telemetry mono" id="telemetry" aria-hidden="true"></div>
  <div class="hint mono" id="hint" aria-hidden="true">[ click to inspect ]</div>

  <nav class="track" id="track" aria-label="Sections">
    <div class="track-line"><div class="track-fill" id="track-fill"></div></div>
  </nav>

  <section class="outro" id="outro" aria-label="About and contact">
    <div class="outro-inner">
      <p class="mono kicker">END OF TRAJECTORY</p>
      <h2>About me</h2>
      <div id="about-text"></div>
      <div class="outro-contact">
        <a class="outro-email" id="email-link" href="#"></a>
        <ul class="outro-links mono" id="outro-links"></ul>
      </div>
      <button type="button" class="mono back-btn" id="back-btn">↑ Back to start</button>
    </div>
  </section>

  <div class="scrim" id="scrim"></div>
  <aside class="panel" id="panel" aria-hidden="true" aria-labelledby="panel-title" role="dialog">
    <button type="button" class="panel-close mono" id="panel-close">Close ✕</button>
    <p class="mono panel-code" id="panel-code"></p>
    <h2 id="panel-title"></h2>
    <p class="panel-meta mono" id="panel-meta"></p>
    <div class="panel-body" id="panel-body"></div>
  </aside>

  <div class="index" id="index" aria-hidden="true">
    <div class="index-inner" id="index-inner"></div>
  </div>

  <noscript><p style="padding:24px">This portfolio needs JavaScript and WebGL.</p></noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
