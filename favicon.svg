<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Rover favicon: dark tile, orange chassis, three wheels, mast with a two-eyed sensor head -->
  <rect width="64" height="64" rx="14" fill="#07090b"/>
  <!-- mast + sensor head -->
  <rect x="22" y="18" width="4" height="12" fill="#e9ece8"/>
  <rect x="13" y="10" width="22" height="11" rx="3" fill="#e9ece8"/>
  <circle cx="19.5" cy="15.5" r="3" fill="#07090b"/>
  <circle cx="28.5" cy="15.5" r="3" fill="#07090b"/>
  <!-- antenna -->
  <path d="M44 30 L49 17" stroke="#e9ece8" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="49.5" cy="16" r="2.5" fill="#ff6a2b"/>
  <!-- chassis -->
  <rect x="8" y="29" width="48" height="12" rx="3" fill="#ff6a2b"/>
  <!-- wheels -->
  <g fill="#e9ece8">
    <circle cx="17" cy="47" r="7"/>
    <circle cx="32" cy="47" r="7"/>
    <circle cx="47" cy="47" r="7"/>
  </g>
  <g fill="#07090b">
    <circle cx="17" cy="47" r="2.5"/>
    <circle cx="32" cy="47" r="2.5"/>
    <circle cx="47" cy="47" r="2.5"/>
  </g>
</svg>
